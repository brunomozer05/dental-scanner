name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-unsigned-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up mise
        uses: jdx/mise-action@v3
        with:
          version: 2026.4.17
          install: true

      - name: Download OpenCV
        run: |
          mkdir -p ThirdParty/OpenCV
          curl -L -o opencv.zip https://github.com/brunomozer05/dental-scanner/releases/download/v1.0-opencv/opencv2.xcframework.zip
          unzip -o opencv.zip
          if [ -d "opencv2.xcframework/opencv2.xcframework" ]; then
            mv opencv2.xcframework/opencv2.xcframework ThirdParty/OpenCV/
          else
            mv opencv2.xcframework ThirdParty/OpenCV/
          fi

      - name: Show tool versions
        run: |
          mise --version
          mise exec tuist -- tuist version
          xcodebuild -version

      - name: Generate Xcode workspace
        run: |
          mise exec tuist -- tuist fetch
          mise exec tuist -- tuist generate

      - name: Run unit tests
        run: |
          set -euo pipefail

          simulator_id="$(
            xcrun simctl list devices available -j |
              python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          for runtime, devices in sorted(payload["devices"].items(), reverse=True):
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          '
          )"

          xcodebuild \
            -workspace DentalScanner.xcworkspace \
            -scheme DentalScannerTests \
            -configuration Debug \
            -destination "id=${simulator_id}" \
            -derivedDataPath build-tests \
            test

      - name: Build app for iphoneos
        run: |
          xcodebuild \
            -workspace DentalScanner.xcworkspace \
            -scheme DentalScanner \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -R build/Build/Products/Release-iphoneos/DentalScanner.app build/Payload/
          cd build
          ditto -c -k --sequesterRsrc --keepParent Payload DentalScanner.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: DentalScanner-unsigned-ipa
          path: build/DentalScanner.ipa
          if-no-files-found: error
